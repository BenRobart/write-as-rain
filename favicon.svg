<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Write as Rain">
  <title>Write as Rain</title>
  <!--
    The homepage hero mark (wr-art-book in site.js), redrawn for 16px.
    Four changes from the hero, all forced by the size:
      * the page ruling lines are gone; at 16px six hairlines inside a 5px-tall
        book are mush, not texture
      * fourteen rain strokes become three, at full opacity rather than the
        hero's 0.72, because sub-pixel marks disappear when you fade them
      * stroke weight is 4.2 (about 1px at 16px) instead of the hero's 1.6,
        which would render here at 0.4px and vanish
      * the rain is a touch heavier than the book at 4.6. Equal weights looked
        right when checked at 48px and above, but a 1px diagonal antialiases
        across two columns at 16px and reads lighter than the book's verticals.

    Colours are the light-theme tokens verbatim: bg #faf5ec on the tile, accent
    #6d1f2a on the marks, accent-soft (that accent at 0.12) inside the pages.
    The tokens are named here without their CSS double-dash prefix on purpose:
    a literal double hyphen is illegal inside an XML comment and makes the whole
    file fail to parse.

    The tile is deliberately not theme-aware. Browser support for
    prefers-color-scheme inside a favicon is uneven, and the paper ground is the
    brand anyway; cream keeps the burgundy legible against any tab strip.
  -->
  <rect width="64" height="64" rx="12" fill="#faf5ec"/>
  <g fill="#6d1f2a" fill-opacity=".12" stroke="#6d1f2a" stroke-width="4.2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page. The closing Z draws the spine, as it does in the hero. -->
    <path d="M32 38.3c-5.4-2.6-13.1-4.2-23.1-4.2-.9 5.5-.9 10.8 0 16.3 10 0 17.7 1.4 23.1 3.7Z"/>
    <!-- Right page, mirrored about x=32 -->
    <path d="M32 38.3c5.4-2.6 13.1-4.2 23.1-4.2 .9 5.5.9 10.8 0 16.3-10 0-17.7 1.4-23.1 3.7Z"/>
    <!-- Rain, leaning 1:3 like the hero's -->
    <path fill="none" stroke-width="4.6" d="m19.9 16.3-3.5 10.5M33.1 11l-4.2 12.6M46.7 14.2l-3.5 10.5"/>
  </g>
</svg>
